<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examinationskalendarium</title>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    :root {
      --bg: #0c0e14;
      --card: #11141d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --exam-color: #ef4444;
      --holiday-bg: rgba(245, 158, 11, 0.08);
      --holiday-border: rgba(245, 158, 11, 0.25);
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 16px; font-weight: 600; }
    .btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.15s; }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn-primary { background: var(--primary); border-color: transparent; }
    .btn-danger { background: #ef4444; border-color: transparent; }
    .tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
    .tab-btn { background: none; border: none; color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .tab-btn.active { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    main { flex: 1; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; display: none; }
    .panel.open { display: block; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
    input[type="text"], input[type="url"], input[type="datetime-local"], input[type="date"] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 8px; font-size: 13px; }
    .list-view { display: flex; flex-direction: column; gap: 8px; }
    .exam-item { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .exam-item.is-exam { border-left-color: var(--exam-color); background: rgba(239, 68, 68, 0.04); }
    .exam-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); text-transform: uppercase; margin-left: 6px; }
    .badge-exam { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .exam-sub { font-size: 12px; color: var(--text-muted); }
    .exam-date { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
    
    /* Kalender-stilar */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
    .cal-header { text-align: center; font-size: 11px; color: var(--text-muted); padding: 6px 0; }
    .cal-cell { min-height: 85px; background: rgba(255,255,255,0.015); border: 1px solid var(--border); border-radius: 4px; padding: 4px; font-size: 11px; display: flex; flex-direction: column; gap: 2px; position: relative; }
    
    /* Dagar utanför aktuell månad */
    .cal-cell.other-month {
      opacity: 0.35;
      border: 1px dashed var(--border);
      background: rgba(255,255,255,0.005);
    }
    
    /* Dagens datum */
    .cal-cell.today {
      border: 1px solid var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }
    .cal-cell.today .cell-num {
      color: var(--primary);
      font-weight: 700;
    }

    /* Lov/Ledighet stil i kalenderruta */
    .cal-cell.holiday {
      background-color: var(--holiday-bg);
      background-image: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(245, 158, 11, 0.03) 6px, rgba(245, 158, 11, 0.03) 12px);
      border-color: var(--holiday-border);
    }
    .holiday-tag {
      font-size: 9px;
      color: #fbbf24;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .cell-num {
      font-size: 11px;
    }

    .cal-pill { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--primary); border-radius: 3px; font-size: 9px; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .cal-pill.is-exam { border-color: var(--exam-color); background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 360px; }
    .modal h2 { font-size: 16px; margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }

    .holiday-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <h1>Examinationskalendarium</h1>
  <div style="display:flex; gap: 8px;">
    <div class="tabs">
      <button class="tab-btn active" id="tabList" onclick="setTab('list')">Lista</button>
      <button class="tab-btn" id="tabCal" onclick="setTab('cal')">Månad</button>
    </div>
    <button class="btn" onclick="toggleSettings()">⚙ Inställningar</button>
  </div>
</header>

<main>
  <div class="panel" id="settingsPanel">
    <div class="input-group">
      <label>Accentfärg</label>
      <input type="color" id="cfgColor" value="#3b82f6" onchange="changeColor(this.value)">
    </div>

    <div class="input-group">
      <label>iCal-länk</label>
      <input type="url" id="icsUrl" value="https://calendar.google.com/calendar/ical/60211rkeojdceiomp6e0omnp27437s6q%40import.calendar.google.com/public/basic.ics">
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-primary" id="syncBtn" onclick="syncSchedule()">Hämta / Uppdatera Schema</button>
      </div>
    </div>

    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;">

    <div class="input-group">
      <label style="color:#fbbf24;">Markera Lov / Ledighet</label>
      <input type="text" id="holidayTitle" placeholder="T.ex. Höstlov, Sportlov..." style="margin-bottom:6px;">
      <div style="display:flex; gap:6px;">
        <div style="flex:1;">
          <span style="font-size:10px; color:var(--text-muted);">Från</span>
          <input type="date" id="holidayStart">
        </div>
        <div style="flex:1;">
          <span style="font-size:10px; color:var(--text-muted);">Till och med</span>
          <input type="date" id="holidayEnd">
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="addHoliday()">Lägg till lov</button>
    </div>

    <div id="holidayList" style="margin-top:10px;"></div>

    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;">

    <div>
      <button class="btn btn-danger" onclick="clearData()">Rensa allt lagrat schema</button>
    </div>
    <div id="statusMsg" style="font-size:12px; margin-top:10px; color:var(--text-muted);"></div>
  </div>

  <div class="filter-bar">
    <div>
      Visa: 
      <button class="btn" id="filterBtn" onclick="toggleFilter()" style="margin-left:4px;">Alla händelser</button>
    </div>
    <div id="countInfo">0 händelser</div>
  </div>

  <div id="listView" class="list-view"></div>
  <div id="calView" style="display:none;">
    <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:12px;">
      <button class="btn" onclick="prevMonth()">&lt;</button>
      <span id="calMonthTitle" style="font-weight:600; font-size:13px;"></span>
      <button class="btn" onclick="nextMonth()">&gt;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</main>

<!-- Redigeringsmodal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Redigera Händelse</h2>
    <input type="hidden" id="editId">
    
    <div class="input-group">
      <label>Titel / Namn</label>
      <input type="text" id="editTitle">
    </div>

    <div class="input-group">
      <label>Sal / Plats</label>
      <input type="text" id="editLoc">
    </div>

    <div style="display:flex; gap:8px;">
      <div class="input-group" style="flex:1;">
        <label>Starttid</label>
        <input type="datetime-local" id="editStart">
      </div>
      <div class="input-group" style="flex:1;">
        <label>Sluttid</label>
        <input type="datetime-local" id="editEnd">
      </div>
    </div>

    <div class="input-group" style="display:flex; align-items:center; gap:8px; margin-top:6px;">
      <input type="checkbox" id="editIsExam" style="width:auto;">
      <label for="editIsExam" style="margin:0; font-size:12px; text-transform:none; color:#fff;">Markera som examination / prov</label>
    </div>

    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteItem()">Radera</button>
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn btn-primary" onclick="saveItem()">Spara</button>
    </div>
  </div>
</div>

<script>
  let events = JSON.parse(localStorage.getItem('cal_events') || '[]');
  let holidays = JSON.parse(localStorage.getItem('cal_holidays') || '[]');
  let onlyExamsView = false;
  let calDate = new Date();

  function save() {
    localStorage.setItem('cal_events', JSON.stringify(events));
    localStorage.setItem('cal_holidays', JSON.stringify(holidays));
    render();
  }

  function changeColor(c) {
    document.documentElement.style.setProperty('--primary', c);
    localStorage.setItem('theme_color', c);
    render();
  }

  const savedColor = localStorage.getItem('theme_color');
  if(savedColor) {
    document.documentElement.style.setProperty('--primary', savedColor);
    document.getElementById('cfgColor').value = savedColor;
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
    renderHolidayList();
  }

  function toggleFilter() {
    onlyExamsView = !onlyExamsView;
    document.getElementById('filterBtn').innerText = onlyExamsView ? "Endast Examinationer" : "Alla händelser";
    document.getElementById('filterBtn').style.borderColor = onlyExamsView ? "var(--exam-color)" : "var(--border)";
    render();
  }

  function setTab(tab) {
    document.getElementById('tabList').classList.toggle('active', tab === 'list');
    document.getElementById('tabCal').classList.toggle('active', tab === 'cal');
    document.getElementById('listView').style.display = tab === 'list' ? 'flex' : 'none';
    document.getElementById('calView').style.display = tab === 'cal' ? 'block' : 'none';
    render();
  }

  /* Lov-hantering */
  function addHoliday() {
    const title = document.getElementById('holidayTitle').value.trim();
    const start = document.getElementById('holidayStart').value;
    const end = document.getElementById('holidayEnd').value;

    if(!title || !start || !end) {
      return alert('Fyll i namn, startdatum och slutdatum för lovet.');
    }
    if(new Date(start) > new Date(end)) {
      return alert('Startdatum kan inte vara efter slutdatum.');
    }

    holidays.push({
      id: '_' + Math.random().toString(36).substr(2, 9),
      title: title,
      start: start,
      end: end
    });

    document.getElementById('holidayTitle').value = '';
    document.getElementById('holidayStart').value = '';
    document.getElementById('holidayEnd').value = '';

    save();
    renderHolidayList();
  }

  function deleteHoliday(id) {
    holidays = holidays.filter(h => h.id !== id);
    save();
    renderHolidayList();
  }

  function renderHolidayList() {
    const list = document.getElementById('holidayList');
    if(!list) return;
    list.innerHTML = '';
    holidays.forEach(h => {
      const item = document.createElement('div');
      item.className = 'holiday-item';
      item.innerHTML = `
        <div>
          <span style="color:#fbbf24; font-weight:600;">🌴 ${h.title}</span>
          <span style="color:var(--text-muted); margin-left:6px;">(${h.start} till ${h.end})</span>
        </div>
        <button class="btn btn-danger" style="padding:2px 6px; font-size:10px;" onclick="deleteHoliday('${h.id}')">&times;</button>
      `;
      list.appendChild(item);
    });
  }

  function getHolidayForDate(dateStr) {
    return holidays.find(h => dateStr >= h.start && dateStr <= h.end);
  }

  /* iCal Sync */
  async function syncSchedule() {
    const btn = document.getElementById('syncBtn');
    const status = document.getElementById('statusMsg');
    let url = document.getElementById('icsUrl').value.trim();

    if(!url) return alert('Ange en URL');

    btn.disabled = true;
    status.innerText = "Hämtar data...";

    const proxyEndpoints = [
      `https://open-web-calendar.hosted.quelltext.eu/calendar.ics?url=${encodeURIComponent(url)}`,
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    ];

    let icsContent = null;

    for (let endpoint of proxyEndpoints) {
      try {
        status.innerText = "Ansluter...";
        let res = await fetch(endpoint);
        if (res.ok) {
          let text = await res.text();
          if (text && text.includes("BEGIN:VCALENDAR")) {
            icsContent = text;
            break;
          }
        }
      } catch (e) {}
    }

    if (!icsContent) {
      status.innerText = "Kunde inte hämta kalenderinnehåll.";
      btn.disabled = false;
      alert("Nätverksbegränsning: Webbläsaren kunde inte läsa länken just nu.");
      return;
    }

    try {
      const parsed = ICAL.parse(icsContent);
      const comp = new ICAL.Component(parsed);
      const vevents = comp.getAllSubcomponents('vevent');
      const keywords = ['prov', 'tenta', 'examination', 'redovisning', 'inlämning', 'dugga'];

      let count = 0;
      vevents.forEach(v => {
        const ev = new ICAL.Event(v);
        const title = ev.summary || 'Lektion';
        const desc = ev.description || '';
        const uid = ev.uid || (title + ev.startDate.toJSDate().getTime());

        const autoExam = keywords.some(k => (title + " " + desc).toLowerCase().includes(k));

        const startDate = ev.startDate.toJSDate();
        const endDate = ev.endDate ? ev.endDate.toJSDate() : new Date(startDate.getTime() + 60*60*1000);

        const existing = events.find(e => e.id === uid);
        if (!existing) {
          events.push({
            id: uid,
            title: title,
            date: startDate.toISOString(),
            endDate: endDate.toISOString(),
            location: ev.location || '–',
            isExam: autoExam
          });
          count++;
        }
      });

      save();
      status.innerText = `Klart! Hittade ${vevents.length} poster (${count} nya tillagda).`;
      setTimeout(() => toggleSettings(), 1200);
    } catch(e) {
      status.innerText = "Tolkningsfel: " + e.message;
      alert("Fel vid tolkning av iCal-filen: " + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function getVisibleEvents() {
    return events
      .filter(e => onlyExamsView ? e.isExam : true)
      .sort((a,b) => new Date(a.date) - new Date(b.date));
  }

  function renderList() {
    const container = document.getElementById('listView');
    container.innerHTML = '';
    
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

    const visible = getVisibleEvents().filter(e => new Date(e.date).getTime() >= startOfToday);
    document.getElementById('countInfo').innerText = `${visible.length} kommande`;

    if(visible.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted); font-size:13px;">Inga kommande händelser.</div>';
      return;
    }

    visible.forEach(ex => {
      const d = new Date(ex.date);
      const endD = ex.endDate ? new Date(ex.endDate) : null;
      const timeStr = endD 
        ? `${d.toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' })} – ${endD.toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' })}`
        : d.toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' });

      const div = document.createElement('div');
      div.className = `exam-item ${ex.isExam ? 'is-exam' : ''}`;
      div.onclick = () => openModal(ex.id);
      div.innerHTML = `
        <div>
          <div class="exam-title">
            ${ex.title}
            ${ex.isExam ? '<span class="badge badge-exam">Examination</span>' : ''}
          </div>
          <div class="exam-sub">Sal: ${ex.location}</div>
        </div>
        <div class="exam-date">
          <div>${d.toLocaleDateString('sv-SE', { weekday:'short', day:'numeric', month:'short' })}</div>
          <div style="color:var(--text-muted)">${timeStr}</div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function renderCal() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const y = calDate.getFullYear();
    const m = calDate.getMonth();
    document.getElementById('calMonthTitle').innerText = new Date(y, m).toLocaleDateString('sv-SE', { month:'long', year:'numeric' }).toUpperCase();

    ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'].forEach(d => {
      grid.innerHTML += `<div class="cal-header">${d}</div>`;
    });

    const firstDayIndex = (new Date(y, m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();

    const today = new Date();
    const isCurrentYear = today.getFullYear() === y;
    const isCurrentMonth = today.getMonth() === m;
    const todayDate = today.getDate();

    const visible = getVisibleEvents();

    function createCell(dayNum, isOther, dateStr, isTodayCell) {
      const holiday = getHolidayForDate(dateStr);
      const cell = document.createElement('div');
      cell.className = `cal-cell ${isOther ? 'other-month' : ''} ${isTodayCell ? 'today' : ''} ${holiday ? 'holiday' : ''}`;
      
      let topHtml = `<div class="cell-top"><span class="cell-num">${dayNum}</span>`;
      if(holiday) {
        topHtml += `<span class="holiday-tag" title="${holiday.title}">🌴 ${holiday.title}</span>`;
      }
      topHtml += `</div>`;
      cell.innerHTML = topHtml;

      visible.filter(e => e.date.startsWith(dateStr)).forEach(e => {
        const pill = document.createElement('div');
        pill.className = `cal-pill ${e.isExam ? 'is-exam' : ''}`;
        pill.innerText = e.title;
        pill.onclick = (ev) => { ev.stopPropagation(); openModal(e.id); };
        cell.appendChild(pill);
      });

      return cell;
    }

    // 1. Föregående månads dagar
    for(let i = firstDayIndex - 1; i >= 0; i--) {
      const dNum = daysInPrevMonth - i;
      const prevD = new Date(y, m - 1, dNum);
      const dStr = `${prevD.getFullYear()}-${String(prevD.getMonth()+1).padStart(2,'0')}-${String(dNum).padStart(2,'0')}`;
      grid.appendChild(createCell(dNum, true, dStr, false));
    }

    // 2. Aktuell månads dagar
    for(let day = 1; day <= daysInMonth; day++) {
      const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isToday = isCurrentYear && isCurrentMonth && day === todayDate;
      grid.appendChild(createCell(day, false, dStr, isToday));
    }

    // 3. Nästa månads dagar
    const totalCells = firstDayIndex + daysInMonth;
    const nextDaysCount = (7 - (totalCells % 7)) % 7;
    for(let day = 1; day <= nextDaysCount; day++) {
      const nextD = new Date(y, m + 1, day);
      const dStr = `${nextD.getFullYear()}-${String(nextD.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      grid.appendChild(createCell(day, true, dStr, false));
    }
  }

  function prevMonth() { calDate.setMonth(calDate.getMonth() - 1); renderCal(); }
  function nextMonth() { calDate.setMonth(calDate.getMonth() + 1); renderCal(); }

  function render() {
    renderList();
    renderCal();
  }

  function toLocalInputString(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function openModal(id) {
    const ex = events.find(e => e.id === id);
    if(!ex) return;
    document.getElementById('editId').value = ex.id;
    document.getElementById('editTitle').value = ex.title;
    document.getElementById('editLoc').value = ex.location;
    
    const startD = new Date(ex.date);
    document.getElementById('editStart').value = toLocalInputString(startD);

    const endD = ex.endDate ? new Date(ex.endDate) : new Date(startD.getTime() + 60*60*1000);
    document.getElementById('editEnd').value = toLocalInputString(endD);

    document.getElementById('editIsExam').checked = !!ex.isExam;
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('editModal').classList.remove('open');
  }

  function saveItem() {
    const id = document.getElementById('editId').value;
    const ex = events.find(e => e.id === id);
    if(ex) {
      ex.title = document.getElementById('editTitle').value.trim() || 'Namnlös';
      ex.location = document.getElementById('editLoc').value.trim() || '–';
      
      const startVal = document.getElementById('editStart').value;
      const endVal = document.getElementById('editEnd').value;

      if(startVal) ex.date = new Date(startVal).toISOString();
      if(endVal) ex.endDate = new Date(endVal).toISOString();

      ex.isExam = document.getElementById('editIsExam').checked;
      save();
      closeModal();
    }
  }

  function deleteItem() {
    const id = document.getElementById('editId').value;
    events = events.filter(e => e.id !== id);
    save();
    closeModal();
  }

  function clearData() {
    if(confirm('Rensa alla sparade lektioner, prov och lov?')) {
      events = [];
      holidays = [];
      save();
      renderHolidayList();
      toggleSettings();
    }
  }

  render();
</script>
</body>
</html>
